<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿する | みんなのパラドックス</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="marble-bg"></div>

<header class="site-header">
  <a href="index.html" class="site-title"><span class="mark">﹈</span>パラドックス図鑑</a>
</header>

<main class="wrap">
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <a href="community.html" class="detail-back">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    一覧に戻る
  </a>

  <h1 class="page-title">投稿する</h1>

  <div class="identity-box" id="identityBox"></div>

  <form id="postForm" class="community-form">
    <label>タイトル<span class="req">必須</span>
      <input type="text" id="fTitle" placeholder="例：エレベーターのボタン連打現象" required>
    </label>

    <label>分類<span class="req">必須</span></label>
    <div class="type-select" id="typeSelect">
      <button type="button" data-type="パラドックス">パラドックス</button>
      <button type="button" data-type="現象">現象</button>
      <button type="button" data-type="ジレンマ">ジレンマ</button>
    </div>
    <input type="hidden" id="fCategory" required>

    <label>説明<span class="req">必須</span>
      <textarea id="fDescription" rows="6" placeholder="どんな内容か、詳しく書いてください" required></textarea>
    </label>

    <label>タグ（複数・任意）
      <input type="text" id="fTags" placeholder="例：日常, 心理, あるある（カンマ区切り）">
    </label>

    <label>具体例（任意）
      <textarea id="fExample" rows="3" placeholder="実際に体験したエピソードなど"></textarea>
    </label>

    <button type="submit" class="submit-btn">投稿する</button>
  </form>

  <div class="post-success" id="postSuccess" style="display:none;"></div>

  <footer class="site-footer">Version 1.2.0</footer>
</main>

<script src="community.js"></script>
</body>
</html>
